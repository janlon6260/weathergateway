name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: janlon6260/weathergateway
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  build:
    name: Publish ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: prod
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: janlon6260
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Native runners avoid QEMU. Portainer pulls ESP-IDF directly from Espressif.
      # Multi-gigabyte SDK layers are never rebuilt or pushed by this workflow.
      - name: Build and push application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          cache-from: type=gha,scope=weathergateway-${{ matrix.arch }},timeout=10s
          cache-to: type=gha,scope=weathergateway-${{ matrix.arch }},mode=max,timeout=10s,ignore-error=true
          provenance: mode=min

  publish:
    name: Publish multi-platform tags
    needs: build
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 1
    steps:
      - name: Set image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: janlon6260
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish manifest for the two completed images
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$TAGS_JSON")
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE_NAME:ci-$RUN_ID-$RUN_ATTEMPT-amd64" \
            "$IMAGE_NAME:ci-$RUN_ID-$RUN_ATTEMPT-arm64"
